<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://kit.fontawesome.com/434950a6f2.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="static/TailPage.css" />
</head>

<body>

  <div class="divLogo">
    <h1>Toolstation</h1>
  </div>

  <div class="div22">
    <div class="div234">
      <i class="fa-solid fa-circle-exclamation  fa-2x"></i>
    </div>
  </div>

  <br>

  <div  id="div23" class="div23">
      
    <div class="div25">

    </div>
    <button id="button2" onclick="clickme()" class="button">add</button>
  </div>
  <br>
  
  <br>
<form>
  <label for="name">Enter product</label> 
  <input id="input3" type="text" value="">
  <button id="button3">submit </button> 
</form>

<button onclick="getProducts()">click</button>


<ul >    
<p id="productsName"></p>   
 <p id="productsPrice"></p>  
  <p id="productsWeight"></p>
</ul>

<p  id="inputValue"></p>

<script lang="Javascript" >

function clickme(){
  const newDiv2 = document.createElement("div")
  newDiv2.classList.add("div23")
  document.getElementById("div23").appendChild(newDiv2)

  const addDiv = document.createElement("div")
  addDiv.classList.add("div25")
  document.getElementById("div23").appendChild(addDiv)

  const button2 = document.createElement("button")
  button2.classList.add("button")
  button2.innerText = "add"
  document.getElementById("button2").appendChild(button2)  
}

async function getProducts(){
  const url = "http://127.0.0.1:8000/products";

  try {
    var response = await fetch(url);
    if (!response.ok){
      throw new Error(`Response status:${response.status}`);
    }
    var result = await response.json();
    console.log(result);
    for (i=0;i<3;i++){
      document.getElementById("productsName").append(result[i]["name"] + " ")
      document.getElementById("productsPrice").append(result[i]["price"] + " ")
      document.getElementById("productsWeight").append(result[i]["weight"] + " ")
    }
    return result;
    
  }
  catch(error){
    console.error(error.message)
  }
}


const x = document.getElementById("input3");


x.addEventListener("input", function(e){

  inpValue = document.getElementById("inputValue")
  
  inpValue.innerText = `${e.target.value}`
  inpValue.classList.add("div23")
  if (e.target.value == ""){
    inpValue.classList.remove("div23")
  }
  if (e.target.value != ""){
    inpValue.classList.add("div23")
  }

  console.log(e.target.value)
  console.log(getProducts(),"hallo")
  
})




</script>
</body>

</html>
