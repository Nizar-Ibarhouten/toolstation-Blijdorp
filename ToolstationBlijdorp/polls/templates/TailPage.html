<script lang="Javascript">

function clickme(){
  const newDiv2 = document.createElement("div")
  newDiv2.classList.add("div23")
  document.getElementById("div23").appendChild(newDiv2)

  const addDiv = document.createElement("div")
  addDiv.classList.add("div25")
  document.getElementById("div23").appendChild(addDiv)

  const button2 = document.createElement("button")
  button2.classList.add("button")
  button2.innerText = "add"
  document.getElementById("button2").appendChild(button2)  
}



const x = document.getElementById("input3");


fetch("http://127.0.0.1:8000/products")
.then(function(response){
  
  return response.json();
})
.then(function(json){
 x.addEventListener("input", function(e){
  
  inpValue = document.getElementById("inputValue")
  
  inpValue.innerText = `${e.target.value}`
  inpValue.classList.add("div23")
  if (e.target.value == ""){
    inpValue.classList.remove("div23")
  }
  if (e.target.value != ""){
    inpValue.classList.add("div23")
  }

const artikel = document.getElementById("artikel")

  for (i=0;i<json.length;i++){
    if (e.target.value == json[i].charAt(0) ||
     e.target.value == json[i].charAt(1) ||
      e.target.value == json[i].charAt(2)||
       e.target.value == json[i].charAt(3)){
    console.log(json[i])
    var p = document.createElement("h3")
    p.innerText = [json[i]]
    p.style.backgroundColor = 'rgb(245, 243, 218)';
    p.style.blockSize  = '200px'
    p.style.border = '2px solid red'
    
    var img = document.createElement("img");
    let countDisplay = document.createElement("p")
    let buttonPlus = document.createElement("button")
    let buttonMinus = document.createElement("button")
    

    img.src = "static/images/milwakee_img.png";
    img.sizes = "auto"
    buttonPlus.innerText = "+"
    buttonMinus.innerText = "-"


    let count = 0;
    countDisplay.innerText = count
    function increaseCount(){
    count++;
    }
    function decreaseCount() {
    count--;
    }
 
    buttonPlus.addEventListener("click",
    function (){
      count++
      countDisplay.innerText = count}

  )
    
    
    buttonMinus.addEventListener("click",
    function () {
      decreaseCount();
      countDisplay.innerText = count
    })


    p.appendChild(img)
    p.appendChild(buttonPlus)
    p.appendChild(buttonMinus)
    p.appendChild(countDisplay)
    artikel.appendChild(p)
    artikel.classList.add("button2")
    
    
  }
   if (e.target.value == ""){
    artikel.innerHTML = ""
    artikel.classList.remove("divnogwat")
  }
  
}  
  
})
})
.catch(function(e){
  console.log(e)
})






</script>
